name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  EARTHLY_USE_INLINE_CACHE: "true"
  EARTHLY_SAVE_INLINE_CACHE: "true"
  FORCE_COLOR: 1
  # Keep in sync with EARTHLY_RELEASE in Earthfile
  EARTHLY_VERSION: "v0.8.16"
  NEKO_VERSION: "2.4.1"

jobs:
  build-Linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux64
            os: ubuntu-22.04
          - platform: LinuxArm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: earthly/actions-setup@v1
        with:
          version: ${{ env.EARTHLY_VERSION }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build devcontainer
        run: earthly +ci-devcontainer --GIT_REF_NAME="${{ github.ref_name }}" --GIT_SHA="${{ github.sha }}"
        env:
          EARTHLY_PUSH: "${{ github.repository_owner == 'andyli' && github.event_name == 'push' }}"
      - name: Build
        run: earthly +ndll-${{ matrix.platform }}
      - name: Test
        run: earthly -P +test
      - uses: actions/upload-artifact@v7
        with:
          name: ndll-${{ matrix.platform }}
          path: bin/ndll/${{ matrix.platform }}/aws.ndll
          if-no-files-found: error

  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            neko: win
            cmake-args: -G "Visual Studio 17 2022" -A Win32
          - platform: Windows64
            os: windows-2022
            neko: win64
            cmake-args: -G "Visual Studio 17 2022" -A x64
          - platform: Mac64
            os: macos-15-intel
            neko: osx64
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - platform: MacArm64
            os: macos-15
            neko: osx-arm64
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Only the neko headers and libs are needed for building the ndll.
      - name: Install neko
        run: |
          NEKO_NAME="neko-${NEKO_VERSION}-${{ matrix.neko }}"
          case "${{ matrix.neko }}" in
            win*) NEKO_FILE="$NEKO_NAME.zip" ;;
            *) NEKO_FILE="$NEKO_NAME.tar.gz" ;;
          esac
          curl -fsSL "https://github.com/HaxeFoundation/neko/releases/download/v${NEKO_VERSION//./-}/$NEKO_FILE" -o "$RUNNER_TEMP/$NEKO_FILE"
          case "$NEKO_FILE" in
            *.zip) 7z x -o"$RUNNER_TEMP" "$RUNNER_TEMP/$NEKO_FILE" ;;
            *) tar -xzf "$RUNNER_TEMP/$NEKO_FILE" -C "$RUNNER_TEMP" ;;
          esac
          NEKOPATH="$RUNNER_TEMP/$NEKO_NAME"
          if command -v cygpath > /dev/null; then NEKOPATH="$(cygpath -m "$NEKOPATH")"; fi
          echo "NEKOPATH=$NEKOPATH" >> "$GITHUB_ENV"
      - run: cmake ${{ matrix.cmake-args }} .
      - run: cmake --build . --target aws.ndll
      - uses: actions/upload-artifact@v7
        with:
          name: ndll-${{ matrix.platform }}
          path: ndll/${{ matrix.platform }}/aws.ndll
          if-no-files-found: error

  package:
    needs: [build-Linux, build-native]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: earthly/actions-setup@v1
        with:
          version: ${{ env.EARTHLY_VERSION }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Linux jobs push the devcontainer images as <tag>-amd64 and <tag>-arm64.
      - name: Publish multi-arch devcontainer image
        if: github.repository_owner == 'andyli' && github.event_name == 'push'
        env:
          # Keep in sync with DEVCONTAINER_IMAGE_NAME_DEFAULT in Earthfile
          IMAGE_NAME: ghcr.io/andyli/aws_sdk_neko_devcontainer
        run: |
          for tag in "${{ github.sha }}" "${{ github.ref_name }}"; do
            docker buildx imagetools create -t "$IMAGE_NAME:$tag" "$IMAGE_NAME:$tag-amd64" "$IMAGE_NAME:$tag-arm64"
          done
      - uses: actions/download-artifact@v8
        with:
          pattern: ndll-*
          path: ${{ runner.temp }}/ndll
      # Move ndll-<platform>/aws.ndll to bin/ndll/<platform>/aws.ndll, which is where +package expects them.
      - name: Gather ndlls
        run: |
          for dir in "$RUNNER_TEMP"/ndll/ndll-*; do
            platform="${dir##*/ndll-}"
            mkdir -p "bin/ndll/$platform"
            mv "$dir/aws.ndll" "bin/ndll/$platform/aws.ndll"
          done
          find bin/ndll -type f
      - name: Package
        run: earthly +ci-package-zip --GIT_REF_NAME="${{ github.ref_name }}" --GIT_SHA="${{ github.sha }}"
        env:
          EARTHLY_PUSH: "${{ github.repository_owner == 'andyli' && github.event_name == 'push' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: haxelib-package
          path: bin/aws-sdk-neko.zip
          if-no-files-found: error
